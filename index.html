<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안서 생성기 — 진로모아커리어센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<meta name="theme-color" content="#FFFFFF">
<style>
  :root{
    --navy:#11308C; --violet:#643DF2; --blue:#295BF2; --lime:#C0D904; --cream:#EAF2AE;
    --line:#E2E5EE; --muted:#666; --ink:#222;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",-apple-system,sans-serif;
    background:#F4F6FB;
    color:var(--ink);
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:20px 24px;
  }
  header .brand{
    font-size:12px;
    color:var(--lime);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:4px;
  }
  header h1{
    font-size:20px;
    margin:0;
    font-weight:700;
  }
  #app{
    max-width:1100px;
    margin:0 auto;
    padding:24px;
  }
  .card{
    background:#fff;
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .card h2{
    font-size:16px;
    margin:0 0 14px;
    color:var(--navy);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:#444;
    margin:14px 0 6px;
  }
  label:first-of-type{margin-top:0}
  input[type="text"], textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    resize:vertical;
  }
  textarea{min-height:70px; line-height:1.6}
  .sub{font-size:12px;color:var(--muted);margin-top:-2px;margin-bottom:6px}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:11px 18px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{opacity:0.9}
  .btn-secondary{background:#F4F6FB;color:var(--navy);border:1px solid var(--line)}
  .btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .tier-edit-block{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .tier-edit-block .tier-head{display:flex;gap:10px;margin-bottom:8px}
  .tier-edit-block .tier-head input{flex:1}
  .status-msg{font-size:13px;margin-top:10px;padding:8px 12px;border-radius:8px;display:none}
  .status-msg.ok{background:#EAF3DE;color:#27500A;display:block}
  .status-msg.error{background:#FCEBEB;color:#791F1F;display:block}

  /* ---------- 미리보기(제안서) ---------- */
  #previewWrap{display:flex;justify-content:center;padding:20px 0}
  #proposalPage{
    width:794px;
    min-height:1123px;
    background:#fff;
    box-shadow:0 4px 24px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  #proposalPage .p-header{background:var(--navy);padding:34px 44px 28px;display:flex;flex-direction:column;gap:6px}
  #proposalPage .p-brand{font-size:13px;font-weight:700;color:var(--cream)}
  #proposalPage .p-title{font-size:27px;font-weight:900;color:#fff;line-height:1.3}
  #proposalPage .p-sub{font-size:14px;color:#fff;opacity:0.85}
  #proposalPage .p-intro{margin:26px 44px 0;font-size:13px;line-height:1.7;background:#F4F6FB;border-radius:10px;padding:14px 18px;white-space:pre-wrap}
  #proposalPage .p-zero{margin:14px 44px 0;background:#C0D904;border-radius:10px;padding:14px 18px}
  #proposalPage .p-zero-badge{font-size:13px;font-weight:900;color:#11308C;margin-bottom:6px}
  #proposalPage .p-zero-text{font-size:13px;font-weight:700;color:#11308C;line-height:1.7;white-space:pre-wrap}
  #proposalPage .p-section-title{padding:22px 44px 0;font-size:16px;font-weight:800;color:var(--navy)}
  #proposalPage .p-tiers{padding:14px 44px 0;display:flex;flex-direction:column;gap:14px}
  #proposalPage .p-tier{border-radius:12px;border:1px solid var(--line);overflow:hidden}
  #proposalPage .p-tier-head{padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
  #proposalPage .p-tier-head .name{font-size:15px;font-weight:800;color:#fff}
  #proposalPage .p-tier-head .tag{font-size:12px;color:var(--cream)}
  #proposalPage .p-tier-body{padding:14px 18px;display:flex;gap:24px}
  #proposalPage .p-tier-col{flex:1}
  #proposalPage .p-tier-col .col-label{font-size:12px;font-weight:700;color:#666;margin-bottom:4px}
  #proposalPage .p-tier-col .col-val{font-size:12.5px;color:#222;line-height:1.7;white-space:pre-wrap}
  #proposalPage .p-common{padding:10px 44px 0;display:flex;gap:12px}
  #proposalPage .p-common div{flex:1;background:#F4F6FB;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#222;line-height:1.6}
  #proposalPage .p-flex{margin:22px 44px 0;padding-top:18px;border-top:1px solid var(--line);text-align:center}
  #proposalPage .p-flex .l1{font-size:13px;color:var(--navy);font-weight:700;line-height:1.7}
  #proposalPage .p-flex .l2{font-size:12.5px;color:#555;line-height:1.7;margin-top:2px}
  #proposalPage .p-footer{margin-top:auto;background:var(--navy);padding:22px 44px;display:flex;align-items:center;justify-content:space-between}
  #proposalPage .p-footer .name{font-size:14px;font-weight:800;color:#fff}
  #proposalPage .p-footer .cred{font-size:12px;color:var(--cream);margin-top:2px}
  #proposalPage .p-footer .contact-label{font-size:12px;color:#fff;opacity:0.85;text-align:right}
  #proposalPage .p-footer .contact-val{font-size:13px;font-weight:700;color:#fff;text-align:right}
  /* 교육 개요·교육 배경·비용 합계 (2026-10-24) */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .grid2 label{margin-top:14px}
  .card h2.sec{margin-top:22px}
  select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#444;margin-top:12px}
  #proposalPage .p-overview{margin:14px 44px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  #proposalPage .p-overview table{width:100%;border-collapse:collapse;font-size:13px}
  #proposalPage .p-overview th{width:110px;background:#F4F6FB;color:var(--navy);font-weight:700;text-align:left;padding:9px 16px;border-bottom:1px solid var(--line)}
  #proposalPage .p-overview td{padding:9px 16px;border-bottom:1px solid var(--line);color:#222;line-height:1.6}
  #proposalPage .p-overview tr:last-child th,#proposalPage .p-overview tr:last-child td{border-bottom:none}
  #proposalPage .p-bg{margin:12px 44px 0;border-left:4px solid var(--navy);background:#F4F6FB;border-radius:0 10px 10px 0;padding:12px 18px;font-size:13px;line-height:1.75;color:#222}
  #proposalPage .p-bg .lbl{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:4px}
  #proposalPage .p-tier.picked{border:2px solid var(--navy)}
  #proposalPage .p-pick{display:inline-block;background:#fff;color:#11308C;font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;margin-left:8px}
  #proposalPage .p-cost{margin:10px 44px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  #proposalPage .p-cost table{width:100%;border-collapse:collapse;font-size:12.5px}
  #proposalPage .p-cost th{background:#F4F6FB;color:#555;font-weight:700;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)}
  #proposalPage .p-cost td{padding:9px 14px;border-bottom:1px solid var(--line);color:#222}
  #proposalPage .p-cost .num{text-align:right;white-space:nowrap}
  #proposalPage .p-cost tr.sum td{background:#11308C;color:#fff;font-weight:800;font-size:13.5px;border-bottom:none}
  #proposalPage .p-cost-note{margin:6px 44px 0;font-size:11.5px;color:#666;line-height:1.6}
  #proposalPage .p-overview,#proposalPage .p-cost,#proposalPage .p-tier{break-inside:avoid}

  /* 블록으로 조립하기 (2026-10-29): 단계별 색 블록을 쌓으면 총 교육 시간·시간표·결과물·AI 이용료가 따라옴 */
  .bd{--s0:#8A90A0;--s1:#0F9AA8;--s2:#3E9B4F;--s3:#643DF2;--s4:#295BF2;--brk:#C9CDD6;margin-top:10px}
  .bd-step{font-size:12px;font-weight:800;color:#D9572B;letter-spacing:.04em;margin:14px 0 6px}
  .bd-chips{display:flex;flex-wrap:wrap;gap:8px}
  .bd-chip{font:inherit;border:1.5px solid #D7DAE2;background:#fff;color:#222;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
  .bd-chip[aria-pressed="true"]{background:#D9572B;border-color:#D9572B;color:#fff}
  .bd-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .bd-btn{font:inherit;border:0;background:#D9572B;color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}
  .bd-btn.line{background:#fff;color:#D9572B;border:1.5px solid #D9572B}
  .bd-stage-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#444;margin:12px 0 7px}
  .bd-dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
  .bd-blks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .bd-blk{font:inherit;text-align:left;border:1.5px solid var(--c);border-left-width:6px;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:#222;transition:transform .12s}
  .bd-blk:hover{transform:translateY(-1px)}
  .bd-blk b{display:block;font-size:13px;line-height:1.35}
  .bd-blk small{color:#7A8194;font-size:11.5px}
  .bd-blk.on{background:var(--c);color:#fff}
  .bd-blk.on small{color:rgba(255,255,255,.85)}
  .bd-ai{font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;margin-left:4px;background:#FCE9E1;color:#8A3517;vertical-align:1px}
  .bd-blk.on .bd-ai{background:rgba(255,255,255,.25);color:#fff}
  .bd-board{display:flex;gap:14px;align-items:stretch;margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px}
  .bd-tcol{flex:none;width:108px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bd-tower{position:relative;width:100%;height:360px;border-radius:10px;background:#FBFBFD;border:1px dashed #D7DAE2;display:flex;flex-direction:column-reverse;overflow:hidden}
  .bd-slab{flex:none;width:100%;background:var(--c);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;border-top:2px solid #fff;transition:height .35s ease;overflow:hidden;padding:0 4px}
  .bd-slab.brk{background:repeating-linear-gradient(45deg,#C9CDD6 0 6px,#E4E6EB 6px 12px);color:#4A5163}
  .bd-slab.over{background:repeating-linear-gradient(45deg,#E5484D 0 6px,#F07A7E 6px 12px)}
  .bd-slab.new{animation:bdDrop .42s cubic-bezier(.3,1.4,.5,1)}
  @keyframes bdDrop{from{transform:translateY(-140px);opacity:.2}to{transform:none;opacity:1}}
  .bd-limit{position:absolute;left:0;right:0;border-top:2px dashed #1F2433;transition:bottom .35s ease;pointer-events:none}
  .bd-limit span{position:absolute;right:4px;top:-18px;font-size:10px;font-weight:800;background:#fff;padding:0 3px}
  .bd-meter{font-size:12px;font-weight:800;text-align:center}
  .bd-meter.ok{color:#30A46C}.bd-meter.warn{color:#B7791F}.bd-meter.bad{color:#E5484D}
  .bd-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .bd-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff}
  .bd-item .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
  .bd-item .nm{flex:1;min-width:0}
  .bd-item .nm b{display:block;font-size:13px;line-height:1.3}
  .bd-item .nm small{color:#7A8194;font-size:11.5px}
  .bd-item.brk{background:#F5F6F9;border-style:dashed}
  .bd-seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .bd-seg button{font:inherit;font-size:11.5px;border:0;background:#fff;padding:4px 7px;cursor:pointer;color:#4A5163}
  .bd-seg button[aria-pressed="true"]{background:#1F2433;color:#fff}
  .bd-ic{font:inherit;border:0;background:none;color:#7A8194;cursor:pointer;font-size:15px;padding:2px 4px;line-height:1}
  .bd-ic:hover{color:#1F2433}
  .bd-empty{color:#7A8194;font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}
  .bd-msg{font-size:12.5px;border-radius:10px;padding:9px 11px;margin-top:10px}
  .bd-msg.bad{background:#FDECEC;color:#9B1C1F}.bd-msg.warn{background:#FEF4E2;color:#7A4B00}.bd-msg.ok{background:#E8F6EE;color:#1B6B43}
  .bd-chip:focus-visible,.bd-blk:focus-visible,.bd-btn:focus-visible,.bd-seg button:focus-visible,.bd-ic:focus-visible{outline:3px solid #FCE9E1;outline-offset:2px}
  .bd input:disabled,.card input:disabled,.card select:disabled{background:#F4F5F7;color:#7A8194}
  @media (max-width:560px){.bd-item{flex-wrap:wrap;row-gap:4px}.bd-item .bar{align-self:auto;height:34px}.bd-item .nm{flex-basis:calc(100% - 20px)}.bd-item .bd-seg{margin-left:14px}.bd-item .bd-ic:first-of-type{margin-left:auto}.bd-tcol{width:80px}.bd-tower{height:330px}.bd-board{gap:10px;padding:10px}}
  @media (prefers-reduced-motion:reduce){.bd-slab,.bd-limit{transition:none}.bd-slab.new{animation:none}}
  /* 제안서 문서: 제안 교육 구성 (기본 5색) */
  #proposalPage .p-planbar{margin:12px 44px 0;display:flex;height:30px;border-radius:8px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #proposalPage .p-planbar span{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;border-right:2px solid #fff;overflow:hidden;white-space:nowrap}
  #proposalPage .p-planbar span:last-child{border-right:0}
  #proposalPage .p-plan{margin:10px 44px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  #proposalPage .p-plan tr,#proposalPage .p-planbar,#proposalPage .p-outs div{break-inside:avoid}
  #proposalPage .p-plan table{width:100%;border-collapse:collapse;font-size:12.5px}
  #proposalPage .p-plan th{background:#F4F6FB;color:#555;font-weight:700;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
  #proposalPage .p-plan td{padding:8px 12px;border-bottom:1px solid var(--line);color:#222;line-height:1.6;vertical-align:top}
  #proposalPage .p-plan tr:last-child td{border-bottom:none}
  #proposalPage .p-plan td.tm{white-space:nowrap;color:#555;width:92px;font-variant-numeric:tabular-nums}
  #proposalPage .p-plan .stg{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:1px 7px;margin-bottom:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #proposalPage .p-plan tr.brk td{background:#FAFBFD;color:#666}
  #proposalPage .p-outs{margin:10px 44px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #proposalPage .p-outs div{background:#F4F6FB;border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.6;border-left:4px solid var(--oc);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @media (max-width:640px){
    #proposalPage .p-planbar,#proposalPage .p-plan,#proposalPage .p-outs{margin-left:20px;margin-right:20px}
    #proposalPage .p-outs{grid-template-columns:1fr}
    #proposalPage .p-plan td.tm{width:auto}
  }

  @media (max-width: 640px){
    #proposalPage .p-header{padding:24px 20px}
    #proposalPage .p-title{font-size:20px}
    #proposalPage .p-intro{margin:20px 20px 0;padding:12px 14px}
    #proposalPage .p-zero{margin:12px 20px 0;padding:12px 14px}
    #proposalPage .p-section-title{padding:18px 20px 0;font-size:15px}
    #proposalPage .p-tiers{padding:12px 20px 0}
    #proposalPage .p-tier-body{flex-direction:column;gap:14px}
    #proposalPage .p-common{padding:10px 20px 0;flex-direction:column;gap:10px}
    #proposalPage .p-flex{margin:18px 20px 0}
    #proposalPage .p-footer{padding:18px 20px;flex-wrap:wrap;gap:10px}
    #proposalPage .p-footer .contact-label,
    #proposalPage .p-footer .contact-val{text-align:left}
    .grid2{grid-template-columns:1fr}
    #proposalPage .p-overview,#proposalPage .p-bg,#proposalPage .p-cost,#proposalPage .p-cost-note{margin-left:20px;margin-right:20px}
    #proposalPage .p-overview th{width:84px;padding:8px 10px}
    #proposalPage .p-overview td{padding:8px 10px}
    #proposalPage .p-cost th,#proposalPage .p-cost td{padding:8px}
  }

  @media print{
    header, #controlsPanel, .no-print{display:none !important}
    body{background:#fff}
    #app{max-width:none;padding:0;margin:0}
    #previewWrap{padding:0}
    #proposalPage{box-shadow:none}
    @page{size:A4;margin:0}
  }
  body{--navy:#D9572B}
  header .brand{color:#FFE3D6 !important}
  #proposalPage{--navy:#11308C}
</style>
<link rel="stylesheet" href="/moa-ui.css"><!-- 2026-10-03 MOA 디자인 키트 (작성 화면만, 제안서 문서 색은 기본 5색 그대로) -->
<style>
body.moa-ui{--navy:#141A2E}
body.moa-ui #proposalPage{--navy:#11308C}
body.moa-ui .btn-row .btn{white-space:nowrap}
@media (max-width:640px){ body.moa-ui .btn-row .btn-primary{flex-basis:100%} body.moa-ui .btn-row .btn{flex:1 1 auto} }
body.moa-ui .tier-edit-block{border-color:var(--moa-line) !important;border-radius:var(--moa-r-md) !important}
body.moa-ui .status-msg.ok{background:var(--moa-lime-soft) !important;color:var(--moa-olive) !important;border-radius:12px}
@media print{ body.moa-ui header,.moa-wordmark,.moa-head-right{display:none !important} body.moa-ui{background:#fff !important} } /* 디자인 키트의 header{display:flex !important}가 인쇄 숨김을 덮어써서 상단 '제안서 생성기' 글자가 찍히던 문제 */
</style>

<body>
<style>
.moa-hubbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1F3A6E;padding:calc(7px + env(safe-area-inset-top,0px)) 14px 7px;font-family:"Noto Sans KR","맑은 고딕","Malgun Gothic",sans-serif;position:relative;z-index:50}
.moa-hubbar a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:8px;border:1px solid rgba(255,255,255,.35)}
.moa-hubbar a:hover,.moa-hubbar a:focus-visible{background:rgba(255,255,255,.12)}
.moa-hubbar span{color:#C0D904;font-size:11px;font-weight:700;letter-spacing:1.4px}

<header>
  <div class="brand"><span>📍</span><span>진로모아커리어센터 · MOA&nbsp;FORMULA</span></div>
  <h1 id="header-title" style="cursor:pointer" title="홈으로">제안서 생성기</h1>
</header>

<script>
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
let TEACHER_ID = (params.get('t') || '').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g, '');

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return escapeHtml(s).replace(/\n/g, '<br>'); }
// 쓰임새 기록 (2026-10-24 · 2단계 정리): 화면이 열린 횟수만 운영보드로 보냄 (이름·기기 정보는 보내지 않음)
function moaUse(s){try{var k=String(s),t=Date.now(),m=window.__moaUse||(window.__moaUse={});if(m[k]&&t-m[k]<600000)return;m[k]=t;var u='https://jinromoa-board.vercel.app/api/usage',b=JSON.stringify({a:'pr',s:k});if(navigator.sendBeacon)navigator.sendBeacon(u,b);else fetch(u,{method:'POST',body:b,keepalive:true,mode:'no-cors'})}catch(e){}}

async function api(path, options){
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(path + sep + 't=' + encodeURIComponent(TEACHER_ID), options);
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}

];
const BD_PURPOSES = [
  { k:'dir', name:'진로 방향', doc:'진로 방향 설정', pri:['tp','star','i1'] },
  { k:'doc', name:'서류 준비', doc:'자기소개서 작성', pri:['rs','star','jd','share'] },
  { k:'itv', name:'면접 대비', doc:'면접 대비', pri:['i1','iv','star','share'] },
  { k:'all', name:'취업 준비 전 과정', doc:'취업 준비 전 과정', pri:['star','rs','i1','tp','iv','share'] }
];
const BD_TIMES = [{ m:50, name:'50분' }, { m:90, name:'90분' }, { m:120, name:'2시간' }, { m:180, name:'3시간' }, { m:360, name:'하루 (6시간)' }];
const BD_ORDER = ['open','tp','jd','star','rs','i1','iv','share','close'];
const BD = {}; BD_BLOCKS.forEach(b => { BD[b.id] = b; });
const BUILD = { on:false, purpose:'all', budget:180, stack:[], autoBreak:true, last:null };
try{ BUILD.on = localStorage.getItem('moa_pr_builder') !== '0'; }catch(e){ BUILD.on = true; }

const bdStage = b => BD_STAGES.find(s => s.k === b.st);
const bdMin = it => it.id === 'brk' ? 10 : (it.deep ? BD[it.id].deep : BD[it.id].min);
const bdSort = st => st.sort((a, b) => BD_ORDER.indexOf(a.id) - BD_ORDER.indexOf(b.id));
// 휴식 자동: 쉬지 않고 60분을 넘기게 되면 그 앞에 10분 휴식
function bdSeq(stack){
  if(!BUILD.autoBreak) return stack.slice();
  const out = []; let run = 0;
  stack.forEach(it => { const m = bdMin(it); if(run > 0 && run + m > 60){ out.push({ id:'brk' }); run = 0; } out.push(it); run += m; });
  return out;
}
const bdTotal = stack => bdSeq(stack).reduce((a, x) => a + bdMin(x), 0);
const bdHours = min => min ? Math.max(1, Math.ceil(min / 30) / 2) : 0; // 30분 단위 올림
function bdRecommend(){
  const p = BD_PURPOSES.find(x => x.k === BUILD.purpose);
  let st = [{ id:'open' }, { id:'close' }];
  p.pri.forEach(id => { const t = bdSort(st.concat([{ id }])); if(bdTotal(t) <= BUILD.budget) st = t; });
  p.pri.forEach(id => { const it = st.find(x => x.id === id); if(!it) return; it.deep = true; if(bdTotal(st) > BUILD.budget) it.deep = false; });
  BUILD.stack = bdSort(st); BUILD.last = 'all';
}
// 제안서에 넘길 내용 (블록이 없으면 null → 기존 방식 그대로)
function bdPlan(){
  if(!BUILD.on || !BUILD.stack.length) return null;
  let t = 0;
  const rows = bdSeq(BUILD.stack).map(x => { const m = bdMin(x), a = t; t += m; return { id:x.id, from:a, to:t, m }; });
  return { rows, total:t, hours:bdHours(t), ai:BUILD.stack.some(x => BD[x.id].ai),
    aiNames:BUILD.stack.filter(x => BD[x.id].ai).map(x => BD[x.id].short),
    purpose:BD_PURPOSES.find(x => x.k === BUILD.purpose).doc,
    outs:BUILD.stack.filter(x => BD[x.id].out).map(x => x.id) };
}

function renderBuilder(){
  const area = document.getElementById('builderArea');
  if(!area) return;
  if(!BUILD.on){ area.innerHTML = ''; return; }
  const seq = bdSeq(BUILD.stack), tot = bdTotal(BUILD.stack), left = BUILD.budget - tot;
  const H = 360, max = Math.max(tot, BUILD.budget) * 1.1;
  let acc = 0;
  const slabs = seq.map((x, i) => {
    const m = bdMin(x), h = Math.max(4, m / max * H), b = x.id === 'brk' ? null : BD[x.id];
    const cls = 'bd-slab' + (b ? '' : ' brk') + (acc >= BUILD.budget ? ' over' : '') + ((BUILD.last === 'all' || BUILD.last === x.id) ? ' new' : '');
    acc += m;
    return `<div class="${cls}" style="height:${h}px;${b ? '--c:var(' + bdStage(b).c + ');' : ''}animation-delay:${BUILD.last === 'all' ? i * 60 : 0}ms">${h >= 22 ? (b ? escapeHtml(b.short) + '<br>' + m + '분' : '휴식') : ''}</div>`;
  }).join('');
  const list = !BUILD.stack.length ? '<div class="bd-empty">위 블록을 누르거나<br>[추천 조합으로 쌓기]를 눌러 주세요.</div>' : seq.map(x => {
    if(x.id === 'brk') return '<div class="bd-item brk"><span class="bar" style="background:var(--brk)"></span><div class="nm"><b>휴식</b><small>10분 · 자동</small></div></div>';
    const b = BD[x.id], i = BUILD.stack.indexOf(x);
    const seg = b.deep !== b.min ? `<div class="bd-seg" role="group" aria-label="진행 깊이"><button type="button" data-bd-depth="${i}" data-v="0" aria-pressed="${!x.deep}">짧게</button><button type="button" data-bd-depth="${i}" data-v="1" aria-pressed="${!!x.deep}">깊게</button></div>` : '';
    return `<div class="bd-item"><span class="bar" style="--c:var(${bdStage(b).c})"></span><div class="nm"><b>${escapeHtml(b.name)}${b.ai ? '<span class="bd-ai">AI</span>' : ''}</b><small>${bdMin(x)}분</small></div>${seg}` +
      `<button type="button" class="bd-ic" data-bd-up="${i}" aria-label="위로">↑</button><button type="button" class="bd-ic" data-bd-down="${i}" aria-label="아래로">↓</button><button type="button" class="bd-ic" data-bd-del="${i}" aria-label="빼기">×</button></div>`;
  }).join('');
  let msg = '';
  if(BUILD.stack.length){
    if(left < 0){
      const c = BUILD.stack.find(x => x.deep && BD[x.id].deep - BD[x.id].min >= -left);
      msg = `<div class="bd-msg bad">교육 시간을 ${-left}분 넘었습니다. ${c ? '「' + escapeHtml(BD[c.id].name) + '」을 짧게로 바꾸면 맞습니다.' : '블록 하나를 빼거나 교육 시간을 늘려 주세요.'}</div>`;
    } else if(left > BUILD.budget * 0.25){
      const d = BUILD.stack.find(x => !x.deep && BD[x.id].deep !== BD[x.id].min && BD[x.id].deep - BD[x.id].min <= left);
      msg = `<div class="bd-msg warn">${left}분이 남습니다. ${d ? '「' + escapeHtml(BD[d.id].name) + '」을 깊게로 바꾸거나 ' : ''}블록을 더 넣을 수 있습니다.</div>`;
    } else msg = '<div class="bd-msg ok">교육 시간에 알맞게 구성되었습니다.</div>';
  }
  area.innerHTML = `<div class="bd">
    <div class="bd-step">교육 목적</div>
    <div class="bd-chips">${BD_PURPOSES.map(p => `<button type="button" class="bd-chip" data-bd-p="${p.k}" aria-pressed="${BUILD.purpose === p.k}">${escapeHtml(p.name)}</button>`).join('')}</div>
    <div class="bd-step">교육 시간</div>
    <div class="bd-chips">${BD_TIMES.map(t => `<button type="button" class="bd-chip" data-bd-t="${t.m}" aria-pressed="${BUILD.budget === t.m}">${escapeHtml(t.name)}</button>`).join('')}</div>
    <div class="bd-act"><button type="button" class="bd-btn" data-bd-rec="1">추천 조합으로 쌓기</button><button type="button" class="bd-btn line" data-bd-clear="1">모두 비우기</button></div>
    <div class="bd-step">블록 고르기 <span style="font-weight:500;color:var(--muted);letter-spacing:0">· 누르면 쌓이고, 한 번 더 누르면 빠집니다. <span class="bd-ai">AI</span> 블록이 있으면 AI 코칭 이용료가 포함됩니다.</span></div>
    ${BD_STAGES.map(s => `<div class="bd-stage-h"><span class="bd-dot" style="background:var(${s.c})"></span>${escapeHtml(s.name)}</div><div class="bd-blks">` +
      BD_BLOCKS.filter(b => b.st === s.k).map(b => { const on = BUILD.stack.some(x => x.id === b.id);
        return `<button type="button" class="bd-blk${on ? ' on' : ''}" data-bd-b="${b.id}" aria-pressed="${on}" style="--c:var(${s.c})"><b>${escapeHtml(b.name)}${b.ai ? '<span class="bd-ai">AI</span>' : ''}</b><small>기본 ${b.min}분${b.deep !== b.min ? ' · 깊게 ' + b.deep + '분' : ''}</small></button>`; }).join('') + '</div>').join('')}
    <div class="bd-board">
      <div class="bd-tcol"><div class="bd-tower">${slabs}<div class="bd-limit" style="bottom:${BUILD.budget / max * H}px"><span>${BUILD.budget}분</span></div></div>
        <div class="bd-meter ${left < 0 ? 'bad' : left > BUILD.budget * 0.25 ? 'warn' : 'ok'}">${left < 0 ? (-left) + '분 초과' : tot + ' / ' + BUILD.budget + '분'}</div></div>
      <div class="bd-list">${list}</div>
    </div>
    ${msg}
    <label class="chk"><input type="checkbox" id="bdBreak"${BUILD.autoBreak ? ' checked' : ''}> 쉬지 않고 60분을 넘기면 휴식 10분 자동으로 넣기</label>
  </div>`;
  BUILD.last = null;
  document.getElementById('bdBreak').addEventListener('change', e => { BUILD.autoBreak = e.target.checked; bdChanged(); });
}
function bdChanged(){ renderBuilder(); if(window.__prUpdate) window.__prUpdate(); }
function bdClick(e){
  const el = e.target.closest('button'); if(!el || !el.closest('#builderArea')) return;
  const ds = el.dataset, S = BUILD.stack;
  if(ds.bdP){ BUILD.purpose = ds.bdP; }
  else if(ds.bdT){ BUILD.budget = Number(ds.bdT); }
  else if(ds.bdRec){ bdRecommend(); moaUse('builder'); }
  else if(ds.bdClear){ BUILD.stack = []; }
  else if(ds.bdB){ const i = S.findIndex(x => x.id === ds.bdB); if(i >= 0) S.splice(i, 1); else { S.push({ id:ds.bdB }); bdSort(S); BUILD.last = ds.bdB; moaUse('builder'); } }
  else if(ds.bdDepth !== undefined){ S[+ds.bdDepth].deep = ds.v === '1'; }
  else if(ds.bdUp !== undefined){ const i = +ds.bdUp; if(i > 0) [S[i - 1], S[i]] = [S[i], S[i - 1]]; }
  else if(ds.bdDown !== undefined){ const i = +ds.bdDown; if(i < S.length - 1) [S[i], S[i + 1]] = [S[i + 1], S[i]]; }
  else if(ds.bdDel !== undefined){ S.splice(+ds.bdDel, 1); }
  else return;
  bdChanged();
}

// 제안서 문서용: 제안 교육 구성 (색 띠 + 시간표 + 교육 결과물)
function bdPlanHtml(plan){
  const bar = plan.rows.map(r => {
    if(r.id === 'brk') return `<span style="flex:${r.m};background:#E2E5EE;color:#666"></span>`;

    return `<span style="flex:${r.m};background:${s.bg};color:${s.fg}">${r.m >= 20 ? escapeHtml(BD[r.id].short) : ''}</span>`;
  }).join('');
  const rows = plan.rows.map(r => {
    if(r.id === 'brk') return `<tr class="brk"><td class="tm">${r.from}~${r.to}분</td><td>휴식</td><td></td></tr>`;
    const b = BD[r.id], s = bdStage(b);

  }).join('');
  return `

      <div class="p-outs">${plan.outs.map(id => `<div style="--oc:${bdStage(BD[id]).bg}">${escapeHtml(BD[id].out)}</div>`).join('')}</div>` : ''}`;

/* ---------- 제안서 미리보기 렌더링 ---------- */
// "17만원" → 170000, "7,500원" → 7500 (읽을 수 없으면 NaN)
function parseWon(s){
  const m = String(s || '').replace(/[,\s원]/g, '').match(/^([\d.]+)(만)?$/);
  return m ? Math.round(parseFloat(m[1]) * (m[2] ? 10000 : 1)) : NaN;
}
function parseNum(s){ const n = parseFloat(String(s || '').replace(/[^\d.]/g, '')); return isNaN(n) ? NaN : n; }
function won(n){ return n.toLocaleString('ko-KR') + '원'; }

// d: 작성 화면 입력값 { school, person, target, count, tier, hours, date, place, bg, ai, travel,
//    rate, aiPrice(이번 제안서 단가), asst·asstPrice(보조강사), book·bookPrice(교재), plan(블록 조립 결과 · 없으면 null) }
function renderProposalPreview(d){
  const c = CONFIG;
  const plan = d.plan || null;
  if (plan) { d.tier = ''; d.hours = String(plan.hours); d.ai = plan.ai; }
  const titleSuffix = d.school ? ` — ${escapeHtml(d.school)}` : '';
  const picked = d.tier === '' || d.tier == null ? -1 : Number(d.tier);
  const pickedTier = c.tiers[picked] || null;

  // 교육 개요 (입력한 줄만 표시)
  const count = parseNum(d.count), hours = parseNum(d.hours);
  const rows = [
    ['교육 목적', plan ? plan.purpose : ''],
    ['교육 대상', d.target],
    ['인원', d.count ? (isNaN(count) ? d.count : count + '명') : ''],
    ['교육 시간', plan ? '총 ' + plan.hours + '시간 (' + plan.total + '분)' : d.hours ? (isNaN(hours) ? d.hours : '총 ' + hours + '시간') : (pickedTier ? pickedTier.duration : '')],
    ['교육 일시', d.date],
    ['교육 장소', d.place]
  ].filter(r => r[1]);
  const overview = (rows.length || pickedTier || d.bg) ? `
      <div class="p-section-title">교육 개요</div>
      <div class="p-overview"><table>
        <tr><th>과정명</th><td>자소서·면접 AI 코칭 프로그램${pickedTier ? ' (' + escapeHtml(pickedTier.name) + ')' : ''}</td></tr>
        ${rows.map(r => `<tr><th>${r[0]}</th><td>${escapeHtml(r[1])}</td></tr>`).join('')}
      </table></div>
      ${d.bg ? `<div class="p-bg"><div class="lbl">교육 배경</div>${nl2br(d.bg)}</div>` : ''}` : '';

  // 예상 비용: 시간을 넣으면 항목별 금액·합계 표, 아니면 단가 안내
  // 단가는 이번 제안서 입력값(d.rate·d.aiPrice) 우선, 비어 있으면 기본값 설정 (2026-10-29)
  const rateStr = d.rate || c.basePricePerHour || '', aiStr = d.aiPrice || c.aiSystemPricePerStudent || '';
  const rate = parseWon(rateStr), ai = parseWon(aiStr), travel = parseNum(d.travel);
  const asst = parseWon(d.asstPrice), book = parseWon(d.bookPrice);
  let cost;
  if (!isNaN(rate) && !isNaN(hours)) {
    const items = [['강사료', `1시간 기준 ${escapeHtml(rateStr)} × ${hours}시간`, rate * hours]];
    if (d.asst) items.push(['보조강사', !isNaN(asst) ? `1시간 기준 ${won(asst)} × ${hours}시간` : '인원과 구성에 따라 협의', !isNaN(asst) ? asst * hours : null]);
    if (d.ai) items.push(['AI 코칭 시스템 이용료', !isNaN(ai) && !isNaN(count)
      ? `학생 1인당 ${escapeHtml(aiStr)} × ${count}명`
      : `학생 1인당 ${escapeHtml(aiStr)} (인원 확정 후 산정)`,
      !isNaN(ai) && !isNaN(count) ? ai * count : null]);
    if (d.book) items.push(['교재 · 워크북', !isNaN(book) && !isNaN(count) ? `학생 1인당 ${won(book)} × ${count}명` : '인원 확정 후 산정', !isNaN(book) && !isNaN(count) ? book * count : null]);
    if (!isNaN(travel)) items.push(['교통비', '실비 기준', travel]);
    const total = items.reduce((sum, it) => sum + (it[2] || 0), 0);
    cost = `
      <div class="p-cost"><table>
        <tr><th>항목</th><th>산출 근거</th><th class="num">금액</th></tr>
        ${items.map(it => `<tr><td><b>${it[0]}</b></td><td>${it[1]}</td><td class="num">${it[2] == null ? '-' : won(it[2])}</td></tr>`).join('')}
        <tr class="sum"><td colspan="2">합계</td><td class="num">${won(total)}</td></tr>
      </table></div>
      <div class="p-cost-note">※ ${d.ai ? 'AI 코칭 시스템 이용료에는 자소서 첨삭·모의면접 AI 프로그램과 개인별 결과 리포트가 포함됩니다. ' : ''}최종 금액은 일정과 구성 확정 후 협의하여 조정할 수 있습니다.</div>`;
  } else {
    cost = `
      <div class="p-common" style="flex-direction:column;gap:6px">
        <div><b>강사료</b> — 1시간 기준 ${escapeHtml(rateStr)}(교육 시간 기준 산정, 기관 일정과 여건에 따라 협의)</div>
        <div><b>AI 코칭 시스템 이용료</b> — 학생 1인당 ${escapeHtml(aiStr)} (자소서 첨삭·모의면접 AI 프로그램 및 개인별 결과 리포트 제공, 심화형 구성은 기본 포함)</div>
      </div>`;
  }

  return `
    <div id="proposalPage">
      <div class="p-header">
        <div class="p-brand">진로모아커리어센터 · MOA&nbsp;FORMULA</div>
        <div class="p-title">자소서·면접 AI 코칭 프로그램 제안서${titleSuffix}</div>
        <div class="p-sub">교육 시간 안에 결과물까지 완성되는 취업 코칭${d.person ? ' — ' + escapeHtml(d.person) + (/님$/.test(d.person) ? '께' : '님께') : ' — 학교·기관 특강용'}</div>
      </div>
      ${overview}
      <div class="p-intro">${nl2br(c.instructorIntro)}</div>
      <div class="p-zero">
        <div class="p-zero-badge">담당자 업무 부담 최소화</div>
        <div class="p-zero-text">${nl2br(c.zeroEffortNote)}</div>
      </div>
      ${plan ? bdPlanHtml(plan) : `<div class="p-section-title">교육 시간에 맞춘 3가지 구성</div>
      <div class="p-tiers">
        ${c.tiers.map((tier, i) => {
          const colors = ['#295BF2', '#643DF2', '#C0D904'];
          const color = colors[i % colors.length];
          const darkText = color === '#C0D904';
          return `
          <div class="p-tier${i === picked ? ' picked' : ''}">
            <div class="p-tier-head" style="background:${color}">
              <div class="name" style="${darkText ? 'color:#11308C' : ''}">${escapeHtml(tier.name)} · ${escapeHtml(tier.duration)}${i === picked ? '<span class="p-pick">제안 구성</span>' : ''}</div>
              <div class="tag" style="${darkText ? 'color:#11308C' : ''}">${escapeHtml(tier.tag)}</div>
            </div>
            <div class="p-tier-body">
              <div class="p-tier-col"><div class="col-label">핵심 내용</div><div class="col-val">${nl2br(tier.content)}</div></div>
              <div class="p-tier-col"><div class="col-label">결과물</div><div class="col-val">${nl2br(tier.output)}</div></div>
              <div class="p-tier-col"><div class="col-label">추천 대상</div><div class="col-val">${nl2br(tier.target)}</div></div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
      <div class="p-section-title">공통 제공 사항</div>
      <div class="p-common">
        ${c.commonPoints.map(p => `<div>${nl2br(p)}</div>`).join('')}
      </div>
      <div class="p-section-title">예상 비용 안내${pickedTier && !isNaN(hours) ? ' (' + escapeHtml(pickedTier.name) + ' 기준)' : ''}</div>
      ${cost}
      <div class="p-flex">
        <div class="l1">${nl2br(c.flexNote)}</div>
      </div>
      <div class="p-footer">
        <div>
          <div class="name">${escapeHtml(c.instructorName)}</div>
          <div class="cred">${escapeHtml(c.instructorCred)}</div>
        </div>
        <div>
          <div class="contact-label">문의</div>
          <div class="contact-val">${escapeHtml(c.contactPhone)}</div>
          <div class="contact-label" style="margin-top:2px">${escapeHtml(c.contactEmail)}</div>
        </div>
      </div>
    </div>
  `;
}

      <label>강사 소개 문구</label>
      <textarea id="edit-intro" style="min-height:100px">${escapeHtml(c.instructorIntro)}</textarea>

      <label>"담당자 업무 부담 최소화" 안내 문구 (별도 진행 관리가 필요 없음을 안내)</label>
      <textarea id="edit-zeroeffort" style="min-height:70px">${escapeHtml(c.zeroEffortNote || '')}</textarea>

      <label>강사료 (1시간 기준)</label>
      <input type="text" id="edit-baseprice" value="${escapeHtml(c.basePricePerHour || '')}" placeholder="예: 17만원" style="margin-bottom:14px">

      <label>AI 코칭 시스템 이용료 (학생 1인당)</label>
      <input type="text" id="edit-aiprice" value="${escapeHtml(c.aiSystemPricePerStudent || '')}" placeholder="예: 7,500원" style="margin-bottom:14px">

      <label>보조강사료 (1시간 기준 · 선택)</label>
      <input type="text" id="edit-asstprice" value="${escapeHtml(c.assistantPricePerHour || '')}" placeholder="비워두면 제안서에 '협의'로 표시" style="margin-bottom:14px">

      <label>교재 · 워크북 (학생 1인당 · 선택)</label>
      <input type="text" id="edit-bookprice" value="${escapeHtml(c.bookPricePerStudent || '')}" placeholder="예: 5,000원" style="margin-bottom:14px">

      <div id="tiersEditArea"></div>

      <label>공통 제공사항 (3줄)</label>
      <textarea id="edit-common" style="min-height:70px">${escapeHtml(c.commonPoints.join('\n'))}</textarea>
      <div class="sub">한 줄에 하나씩 입력하세요.</div>

      <label>하단 안내 문구</label>
      <textarea id="edit-flex">${escapeHtml(c.flexNote)}</textarea>

      <label>강사명</label>
      <input type="text" id="edit-name" value="${escapeHtml(c.instructorName)}">
      <label>강사 소개(짧은 경력줄)</label>
      <input type="text" id="edit-cred" value="${escapeHtml(c.instructorCred)}">
      <label>연락처</label>
      <input type="text" id="edit-phone" value="${escapeHtml(c.contactPhone)}">
      <label>이메일</label>
      <input type="text" id="edit-email" value="${escapeHtml(c.contactEmail)}">

      <div class="btn-row">
        <button class="btn btn-primary" id="saveSettingsBtn">저장</button>
        <button class="btn btn-secondary" id="cancelSettingsBtn">취소</button>
      </div>
      <div id="saveStatus" class="status-msg" style="display:none"></div>
    </div>
  `;

  const tiersArea = document.getElementById('tiersEditArea');
  c.tiers.forEach((tier, i) => {
    const block = document.createElement('div');
    block.className = 'tier-edit-block';
    block.innerHTML = `
      <div class="tier-head">
        <div style="flex:1">
          <label style="margin-top:0">구성 ${i+1} 이름</label>
          <input type="text" class="t-name" data-i="${i}" value="${escapeHtml(tier.name)}">
        </div>
        <div style="flex:1">
          <label style="margin-top:0">소요 시간</label>
          <input type="text" class="t-duration" data-i="${i}" value="${escapeHtml(tier.duration)}">
        </div>
      </div>
      <label>한 줄 태그</label>
      <input type="text" class="t-tag" data-i="${i}" value="${escapeHtml(tier.tag)}">
      <label>핵심 내용</label>
      <textarea class="t-content" data-i="${i}">${escapeHtml(tier.content)}</textarea>
      <label>결과물</label>
      <textarea class="t-output" data-i="${i}">${escapeHtml(tier.output)}</textarea>
      <label>추천 대상</label>
      <textarea class="t-target" data-i="${i}">${escapeHtml(tier.target)}</textarea>
    `;
    tiersArea.appendChild(block);
  });

  document.getElementById('cancelSettingsBtn').addEventListener('click', renderGenerator);

  document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('saveStatus');
    const newTiers = c.tiers.map((_, i) => ({
      name: document.querySelector(`.t-name[data-i="${i}"]`).value.trim(),
      duration: document.querySelector(`.t-duration[data-i="${i}"]`).value.trim(),
      tag: document.querySelector(`.t-tag[data-i="${i}"]`).value.trim(),
      content: document.querySelector(`.t-content[data-i="${i}"]`).value,
      output: document.querySelector(`.t-output[data-i="${i}"]`).value,
      target: document.querySelector(`.t-target[data-i="${i}"]`).value
    }));
    const newConfig = {
      instructorIntro: document.getElementById('edit-intro').value,
      zeroEffortNote: document.getElementById('edit-zeroeffort').value,
      basePricePerHour: document.getElementById('edit-baseprice').value.trim(),
      aiSystemPricePerStudent: document.getElementById('edit-aiprice').value.trim(),
      assistantPricePerHour: document.getElementById('edit-asstprice').value.trim(),
      bookPricePerStudent: document.getElementById('edit-bookprice').value.trim(),
      tiers: newTiers,
      commonPoints: document.getElementById('edit-common').value.split('\n').map(s => s.trim()).filter(Boolean),
      flexNote: document.getElementById('edit-flex').value,
      instructorName: document.getElementById('edit-name').value.trim(),
      instructorCred: document.getElementById('edit-cred').value.trim(),
      contactPhone: document.getElementById('edit-phone').value.trim(),
      contactEmail: document.getElementById('edit-email').value.trim()
    };
    try{
      await api('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(newConfig) });
      CONFIG = newConfig;
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '저장되었습니다.';
      statusEl.style.display = 'block';
      setTimeout(renderGenerator, 600);
    }catch(err){
      statusEl.className = 'status-msg error';
      statusEl.textContent = err.message;
      statusEl.style.display = 'block';
    }
  });
}

/* ---------- 초기화 ---------- */
(async function init(){
  if(params.get('master') === '1'){ renderMasterScreen(); return; }

  if(!TEACHER_ID){ renderTeacherSetup(); return; }

  try{
    const { config } = await api('/api/config');
    CONFIG = config;
  }catch(err){
    app.innerHTML = `<div class="card status-msg error" style="display:block;margin:40px auto;max-width:500px">설정을 불러오지 못했습니다: ${escapeHtml(err.message)}</div>`;
    return;
  }
  renderGenerator();
})();
</script>
