<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진로모아 운영보드</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="진로모아">
<meta name="theme-color" content="#1F2433">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-180.png">
<style>
:root{
  --navy:#11308C; --violet:#643DF2; --blue:#295BF2; --lime:#C0D904; --lime-soft:#EAF2AE;
  --warn:#F5A524; --warn-bg:#FEF3E2; --ok:#30A46C; --ch:#1F2433; --danger:#E5484D; --danger-bg:#FDECEC;
  --g0:#FFFFFF; --g1:#F7F8FA; --g2:#EEF0F4; --g3:#DDE1E9; --g4:#6B7280; --g5:#1F2430;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--g1);color:var(--g5);word-break:keep-all;overflow-wrap:break-word;
  font-family:"Noto Sans KR","맑은 고딕","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:15px;line-height:1.6;
}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
.brand{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:8px}
.brand:active{opacity:.6}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--g4);letter-spacing:0}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:var(--radius);border:1px solid var(--g3);background:var(--g0);color:var(--g5);padding:12px 16px;min-height:46px;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--g4)}
button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.btn-main{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700}
.btn-main:hover{background:#5533d6;border-color:#5533d6}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-kakao{background:#FEE500;border-color:#FEE500;color:rgba(0,0,0,.85);font-weight:700}
.btn-kakao:hover{background:#F5DC00;border-color:#F5DC00}
.btn-sm{padding:6px 11px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.metric{background:var(--g0);border:1px solid var(--g3);border-radius:var(--radius);padding:10px 12px}
.metric b{display:block;font-size:19px;color:var(--navy);line-height:1.3}
.metric span{font-size:12px;color:var(--g4)}
.risks{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.risk{display:flex;gap:8px;align-items:flex-start;background:var(--danger-bg);border-left:4px solid var(--danger);border-radius:0;padding:9px 12px;font-size:13px;color:#8d2b2e}
.risk.warn{background:var(--warn-bg);border-left-color:var(--warn);color:#8a5a06}
.risk b{font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--g3);background:var(--g0);border-radius:22px;padding:10px 16px;font-size:14px;min-height:42px;color:var(--g4)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.card{background:var(--g0);border:1px solid var(--g3);border-radius:12px;padding:15px 15px;margin-bottom:10px;min-height:76px}
.card:active{background:var(--g1)}
.card h3{margin:0 0 3px;font-size:16px;color:var(--g5);font-weight:700}
.card .sub{font-size:13px;color:var(--g4);margin-bottom:9px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.flag{background:var(--danger-bg);color:#a32d2d}
.pill.flagw{background:var(--warn-bg);color:#8a5a06}
.pill.money{background:var(--g2);color:var(--navy);font-weight:700}
.empty{background:var(--g0);border:1px dashed var(--g3);border-radius:12px;padding:32px 18px;text-align:center;color:var(--g4);font-size:14px}
.fab{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;margin-top:14px}
.fab button{flex:1;padding:13px}
#dlg{display:none;margin:0 0 12px}
.sheet{background:var(--g0);border:1px solid var(--g3);border-radius:14px;padding:14px}
.backbar{position:sticky;top:0;z-index:5;display:flex;gap:9px;align-items:center;margin:0 0 6px;padding:8px 0;background:var(--g0)}
.backbar button{padding:10px 14px;font-size:14px;min-height:44px;flex:0 0 auto}
.backbar .ttl{font-weight:700;color:var(--navy);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:90;max-width:88vw;text-align:center}
#toast.show{display:block}
.sheet h2{margin:0 0 12px;font-size:17px;color:var(--navy)}
label{display:block;font-size:13px;color:var(--g4);margin:14px 0 5px}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:12px 11px;min-height:48px;border:1px solid var(--g3);border-radius:9px;background:var(--g0);color:var(--g5)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:430px){.row2{grid-template-columns:1fr;gap:0}}
.seghead{margin:18px 0 2px;padding-top:12px;border-top:1px solid var(--g3);font-size:13px;font-weight:700;color:var(--navy)}
.navtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--g2);padding:4px;border-radius:12px}
.nav{flex:1;border:none;background:transparent;color:var(--g4);font-size:15px;padding:12px;min-height:46px;border-radius:9px}
.nav[aria-pressed="true"]{background:var(--g0);color:var(--navy);font-weight:700;border:1px solid var(--g3)}
.tabs{display:flex;gap:6px;margin:0 0 4px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;padding:11px 16px;font-size:14px;min-height:44px;border-radius:22px;border:1px solid var(--g3);background:var(--g0);color:var(--g4)}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.card{cursor:pointer}
.wrap{--navy:#1F2433;--violet:#1F2433;--blue:#1F2433}
.docpage,.a4view,.doc{--navy:#11308C;--violet:#643DF2;--blue:#295BF2;font-family:"맑은 고딕","Malgun Gothic","Noto Sans KR",sans-serif}
.btn-main:hover{background:#343B4F;border-color:#343B4F}
#toast{background:#1F2433}
.brand .moa{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.6px;color:#1F2433;margin-bottom:2px}
.brand .moa i{width:8px;height:8px;border-radius:50%;background:#C0D904;display:inline-block}
.nav{padding:12px 4px}
@media (max-width:430px){.nav{font-size:14px}}
.sig{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.card.pcard{background:var(--g0);border:1px solid var(--g3);border-left:6px solid var(--sg);box-shadow:0 1px 3px rgba(17,48,140,.07)}
.card.pcard h3{color:var(--g5)}
.pst{float:right;text-align:right;font-size:12px;font-weight:700;color:var(--sg);line-height:1.4}
.pst b{display:block;font-size:15px;color:var(--g5)}
.pbar{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.pbar i{flex:1;height:7px;background:var(--g2);border-radius:4px;overflow:hidden;display:block}
.pbar i s{display:block;height:100%;background:var(--sg)}
.pbar span{font-size:12px;color:var(--g4);min-width:36px;text-align:right}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:13px;padding:7px 12px;min-height:36px;border-radius:18px;border:1px solid var(--g3);background:var(--g0);color:var(--g4)}
.pchip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.pchip.add{border-style:dashed;color:var(--blue)}
.pchip.del{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.pchip small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:1px}
.pchip.late{border-color:#E5484D;color:#B42318;background:#FDECEC}
.pchip.skip{opacity:.55}
.retrobox{background:#F3F0FF;border:1px solid #DCD3FD;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.retrobox summary{cursor:pointer;font-weight:700;color:#4B2BC7;font-size:14px}
.retroitem{background:#fff;border-radius:9px;padding:9px 11px;margin-top:8px;font-size:13.5px}
.retroitem b{display:block;color:var(--g5)}
.retroitem span{display:block;color:var(--g4);font-size:12px;margin-bottom:4px}
.retroitem p{margin:4px 0 0;line-height:1.55}
.retroitem i{font-style:normal;display:inline-block;font-size:11.5px;font-weight:700;color:#643DF2;background:#EFEAFE;border-radius:8px;padding:0 7px;margin-right:6px}
.pchip.soon{border-color:#F5A524;color:#8A5A00;background:#FEF6E6}
.pnext{font-size:13px;color:var(--g5);margin:2px 0 4px}
.ptodo{background:var(--g0);border:1px solid var(--g3);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.ptodo h4{margin:0 0 8px;font-size:15px;color:var(--g5)}
.ptodo h4 em{font-style:normal;background:#E5484D;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;margin-left:4px}
.ptodo-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--g2);font-size:14px}
.ptodo-row span{color:var(--g4);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptodo-row small{font-weight:700;font-size:12px;white-space:nowrap}
.ptodo-none,.ptodo-more{font-size:13px;color:var(--g4)}
.card:hover{border-color:var(--blue)}
.card .open{float:right;font-size:12px;color:var(--blue);font-weight:700}
.hint{font-size:13px;color:var(--g4);margin:0 0 9px}
.statchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.sbtn{flex:0 0 auto;border:1px solid var(--g3);background:var(--g0);color:var(--g4);border-radius:22px;padding:10px 15px;font-size:14px;min-height:44px}
.sbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.contact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.contact button{flex:1 1 40%;color:var(--navy);border:1px solid var(--g3);border-radius:9px;padding:12px 6px;font-size:14px;font-weight:700;background:var(--g0);min-height:48px}
#search{margin-bottom:10px}
.filelist{margin-top:8px;border:1px solid var(--g3);border-radius:10px;overflow:hidden}
.fileitem{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--g3);font-size:13px}
.fileitem:last-child{border-bottom:none}
.flabel{background:var(--g2);color:var(--navy);border-radius:14px;padding:4px 10px;font-size:12px;white-space:nowrap}
.fname{flex:1;color:var(--g4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileitem a{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap;padding:6px 4px}
.fileitem button{padding:6px 10px;min-height:36px;font-size:12px;color:var(--danger);border-color:#f2c0c1}
.backup{display:flex;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--g3)}
.backup{flex-wrap:wrap}
.backup button{flex:1 1 40%;font-size:14px}
#undobar{display:none;align-items:center;gap:10px;background:var(--warn-bg);border-left:4px solid var(--warn);padding:11px 13px;margin-bottom:10px;font-size:13px;color:#8a5a06}
#undobar.on{display:flex}
#undobar button{margin-left:auto;padding:8px 14px;min-height:40px;font-size:13px;background:var(--g0)}
.calcbox{margin-top:14px;background:var(--g1);border:1px solid var(--g3);border-radius:10px;padding:11px 13px;font-size:13px}
.calcbox div{display:flex;justify-content:space-between;padding:2px 0}
.calcbox .tot{border-top:1px solid var(--g3);margin-top:6px;padding-top:7px;font-size:15px;font-weight:700;color:var(--navy)}
.actions{position:sticky;bottom:0;display:flex;gap:8px;margin-top:18px;padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px));background:var(--g0);border-top:1px solid var(--g3);flex-wrap:wrap}
.actions button{flex:1;min-width:104px}
.danger-txt{color:var(--danger);border-color:#f2c0c1}
.docbar{display:flex;gap:8px;margin-top:12px}
.docbar button{flex:1}
.note{font-size:12px;color:var(--g4);margin-top:12px;text-align:center}

#docArea{display:none;margin:0 0 12px}
.doctoolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.doctoolbar button{flex:1;min-width:88px;font-size:13px;padding:10px 6px}
.docpage{padding:0 0 20px}
.doc{background:#fff;color:#1F2430;padding:26px 22px;font-size:14px;line-height:1.7;border:1px solid var(--g3);border-radius:8px}
.doc .dhead{border-bottom:4px solid var(--violet);padding-bottom:12px;margin-bottom:18px}
.doc.quote .dhead{border-bottom-color:var(--navy)}
.doc.report .dhead{border-bottom-color:var(--lime)}
.doc.callsheet .dhead{border-bottom-color:var(--blue)}
.doc .dkind{font-size:12px;color:var(--g4);letter-spacing:2px}
.doc h1{margin:4px 0 2px;font-size:24px;color:var(--navy);letter-spacing:-.5px}
.doc .dorg{font-size:14px;color:var(--g4)}
.doc h2{font-size:15px;color:var(--navy);margin:20px 0 8px;padding-left:9px;border-left:4px solid var(--lime)}
.doc{word-break:keep-all;overflow-wrap:break-word}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.doc p,.doc li,.doc td{word-break:keep-all;overflow-wrap:break-word}
.doc th,.doc td{border:1px solid var(--g3);padding:7px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--g2);color:var(--navy);font-weight:700;width:28%;white-space:nowrap;word-break:keep-all}
.doc .qtab th{width:auto;text-align:center}
.doc .qtab td{text-align:right}
.doc .qtab td:first-child{text-align:left}
.doc .sum{background:var(--lime-soft);font-weight:700;color:var(--navy)}
.doc ul{margin:6px 0;padding-left:18px}
.doc .foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--g3);font-size:12px;color:var(--g4);display:flex;justify-content:space-between}
.doc .stamp{margin-top:22px;text-align:right;font-size:14px;color:var(--navy);font-weight:700}
@media print{
  :root{padding:0}
  body{background:#fff}
  .wrap,#dlg,.fab,.doctoolbar{display:none!important}
  #docArea{display:block!important;position:static;overflow:visible}
  .docpage{padding:0;max-width:none}
  .doc{padding:0;border:none}
  @page{margin:16mm}
}
</style>
<style id="a4css">
.a4view{width:100%;overflow:hidden;border:1px solid var(--g3);border-radius:6px;background:#fff}
.a4scale{width:794px;transform-origin:top left}
.a4page{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;color:#1F2430;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box;line-height:1.5}
.a4page *{box-sizing:border-box}
.a4page img{max-width:none}
.rsm{padding:12mm 16mm 17mm}
.rsm .a4-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #11308C;padding-bottom:9px}
.rsm .a4-top h1{margin:0;font-size:25pt;letter-spacing:10px;color:#11308C;font-weight:800;line-height:1.2}
.rsm .a4-top h1 span{display:block;width:44px;height:5px;background:#C0D904;margin-top:7px}
.rsm .a4-brand{display:flex;align-items:center;gap:8px;font-size:9.5pt;color:#6B7280;text-align:right}
.rsm .a4-brand img{height:34px}
.rsm .a4-brand b{display:block;color:#11308C;font-size:10.5pt}
.rsm h2{font-size:11pt;color:#11308C;margin:9px 0 4px;display:flex;align-items:center;gap:7px;font-weight:700}
.rsm h2:before{content:"";width:9px;height:9px;background:#643DF2;border-radius:2px}
.rsm h2 small{font-weight:400;color:#9AA1AE;font-size:8.5pt;margin-left:2px}
.rsm table{width:100%;border-collapse:collapse;font-size:9.3pt;table-layout:fixed}
.rsm th,.rsm td{border:1px solid #DDE1E9;padding:3.6px 8px;vertical-align:middle;overflow:hidden}
.rsm th{background:#F3F4F8;color:#11308C;font-weight:700;text-align:center}
.rsm td.c{text-align:center;color:#4B5563;white-space:nowrap}
.rsm td.nm{font-size:12pt;font-weight:700}
.rsm .a4-info{display:flex;gap:10px;margin-top:6px}
.rsm .a4-info table th{width:24mm}
.rsm .a4-photo{width:30mm;height:40mm;flex:0 0 30mm;border:1px solid #DDE1E9;overflow:hidden}
.a4-photo img,.a4-sphoto img{width:100%;height:100%;object-fit:cover;display:block}
.rsm .a4-pledge{margin-top:10px;border:1px solid #DDE1E9;border-radius:6px;padding:9px 14px;font-size:10pt;background:#FAFBFC}
.rsm .a4-sig{display:flex;justify-content:flex-end;gap:26px;margin-top:6px;align-items:center;color:#6B7280}
.rsm .a4-sig b{color:#1F2430;margin-left:6px}
.rsm .a4-line{display:inline-block;width:32mm;border-bottom:1px solid #1F2430;margin:0 6px}
.rsm .a4-foot{position:absolute;left:16mm;right:16mm;bottom:8mm;display:flex;justify-content:space-between;font-size:8pt;color:#9AA1AE;border-top:1px solid #EEF0F4;padding-top:6px}
.rsm .a4-foot b{color:#11308C}
.prf{display:flex}
.prf .a4-side{width:72mm;background:#11308C;color:#fff;padding:16mm 10mm 12mm;position:relative}
.prf .a4-sphoto{width:44mm;height:56mm;margin:0 auto;border-radius:10px;overflow:hidden;border:3px solid #fff;background:#DDE3F3}
.prf .a4-nm{text-align:center;margin-top:12px;font-size:21pt;font-weight:800;letter-spacing:3px}
.prf .a4-tt{text-align:center;font-size:9.5pt;color:#EAF2AE;margin-top:3px}
.prf h3{font-size:9pt;letter-spacing:2px;color:#C0D904;margin:18px 0 7px;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:4px}
.prf .a4-chips{display:flex;flex-wrap:wrap;gap:5px}
.prf .a4-chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:3px 9px;font-size:8.8pt}
.prf .a4-side ul{list-style:none;margin:0;padding:0;font-size:8.8pt;line-height:1.55}
.prf .a4-side li{margin-bottom:5px}
.prf .a4-side li small{color:#B8C3E6;display:block;font-size:7.8pt;line-height:1.3}
.prf .a4-logo{position:absolute;left:10mm;right:10mm;bottom:12mm;display:flex;align-items:center;gap:7px;font-size:8.3pt;color:#C8D0EA}
.prf .a4-logo img{height:28px}
.prf .a4-logo b{display:block;color:#fff;font-size:9.3pt}
.prf .a4-main{flex:1;padding:16mm 14mm 12mm 12mm;position:relative}
.prf .a4-kind{font-size:8.5pt;letter-spacing:3px;color:#643DF2;font-weight:700}

<script>
var STATUS=["문의","제안","견적","확정","배정","실행","보고","정산"];
var STC={
 "문의":["#64748B","#F1F4F8"],"제안":["#0E7490","#E4F4F8"],"견적":["#C2410C","#FDEEE4"],
 "확정":["#295BF2","#E9EFFE"],"배정":["#643DF2","#F1ECFF"],"실행":["#BE185D","#FCEAF3"],
 "보고":["#047857","#E3F5EE"],"정산":["#5B7A00","#F2F7DA"],"전체":["#1F2433","#EEF0F4"]
};
var SC={}; Object.keys(STC).forEach(function(k){ SC[k]=[STC[k][0],"#FFFFFF"] });
function stVars(st){ var c=STC[st]||STC["문의"]; return "--st:"+c[0]+";--stp:"+c[1] }
var DB=null, cases=[], staff=[], filter="전체", yf="전체", mode="lecture", q="", viewC=[], viewS=[];

function won(n){return (Math.round(n||0)).toLocaleString("ko-KR")+"원"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dday(ds){if(!ds)return null;var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((d-today())/86400000)}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var anchorEl=null;
function el(id){return document.getElementById(id)}
function parkPanels(){
  if(el("dlg")) el("dlg").style.display="none";
  if(el("docArea")) el("docArea").style.display="none";
}
function onlyCard(node){
  Array.prototype.forEach.call(document.querySelectorAll("#list .card"),function(x){
    x.style.display=(node&&x===node)?"":"none";
  });
  el("chips").style.display="none"; el("search").style.display="none"; el("risks").style.display="none";
  el("metrics").style.display="none"; document.querySelector(".fab").style.display="none";
  Array.prototype.forEach.call(document.querySelectorAll(".backup"),function(x){x.style.display="none"}); hideUndo();
  var hint=document.querySelector("#list .hint"); if(hint) hint.style.display="none";
  Array.prototype.forEach.call(document.querySelectorAll("#list .calwrap,#list .caldaytitle,#list .empty"),function(x){x.style.display="none"});
}
function openModal(){
  el("dlg").style.display="block"; el("docArea").style.display="none";
  onlyCard(anchorEl);
  try{ el("dlg").scrollIntoView({block:"start",behavior:"smooth"}) }catch(e){}
}
function openDocPanel(){
  el("dlg").style.display="none"; el("docArea").style.display="block";
  onlyCard(anchorEl);
  try{ el("docArea").scrollIntoView({block:"start",behavior:"smooth"}) }catch(e){}
}
function closeModal(){
  parkPanels();
  document.querySelector(".fab").style.display="";
  Array.prototype.forEach.call(document.querySelectorAll(".backup"),function(x){x.style.display="flex"});
  el("metrics").style.display=""; el("search").style.display="";
  render();
  if(anchorEl){ var id=anchorEl.getAttribute("data-id")||anchorEl.getAttribute("data-sid");
    var back=document.querySelector('#list [data-id="'+id+'"],#list [data-sid="'+id+'"]');
    if(back){ try{ back.scrollIntoView({block:"center"}) }catch(e){} }
  }
  anchorEl=null;
}
function show(which){ if(which==="doc") openDocPanel(); else if(which==="sheet") openModal(); else closeModal(); }
function backbar(title,onBack){
  return '<div class="backbar"><button type="button" id="btnBack">← 목록</button><span class="ttl">'+esc(title)+'</span></div>';
}
var toastT=null;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},2200)}

var DEFAULT_TIERS=[{max:20,amt:0},{max:50,amt:20000},{max:100,amt:40000},{max:150,amt:60000},{max:200,amt:80000}];
var DEFAULT_OVER=100000;
function travelTiers(){
  var C=CENTER||{};
  var t=(C.travelTiers&&C.travelTiers.length)?C.travelTiers:DEFAULT_TIERS;
  return t.filter(function(x){return +x.max>0}).sort(function(a,b){return a.max-b.max});
}
function travelOver(){ var C=CENTER||{}; return (C.travelOver!==undefined&&C.travelOver!=="")?+C.travelOver:DEFAULT_OVER }
function travelByKm(km){
  km=+km||0; if(km<=0) return {amt:0,label:""};
  var tiers=travelTiers(), prev=0;
  for(var i=0;i<tiers.length;i++){
    if(km<=+tiers[i].max) return {amt:+tiers[i].amt||0,label:prev+"~"+tiers[i].max+"km"};
    prev=+tiers[i].max;
  }
  return {amt:travelOver(),label:prev+"km 초과"};
}
function calc(c){
  var hours=+c.hours||0, fee=(+c.billRate||0)*hours, trPay=+c.travel||0, mt=+c.material||0;
  var billed=(c.travelBill===false)?0:trPay;
  var sub=fee+billed+mt, vat=c.taxable?Math.round(sub*0.1):0;
  var pay=(+c.payRate||0)*hours, wh=Math.round(pay*0.033);
  return {fee:fee,tr:billed,trPay:trPay,mt:mt,sub:sub,vat:vat,total:sub+vat,
    pay:pay,wh:wh,net:pay-wh,netAll:pay-wh+trPay,
    margin:fee+billed-pay-trPay};
}

var PIN="";
function api(body){
  return fetch("/api/store",{method:"POST",headers:{"Content-Type":"application/json","x-pin":PIN},
    body:JSON.stringify(body)}).then(function(r){
      if(r.status===401){ throw new Error("PIN") }
      return r.json();
    });
}
var CENTER=null;
async function initStore(){
  PIN=localStorage.getItem("jm_pin")||"";
  document.getElementById("storeNote").textContent="데이터가 서버에 저장됩니다";
}
async function loadAll(){
  try{
    var r=await api({op:"load"});
    cases=r.cases||[]; staff=(r.staff||[]).map(normStaff); CENTER=r.center||null;
    try{ localStorage.setItem("jm_cache",JSON.stringify({cases:cases,staff:staff,center:CENTER})) }catch(e){}
  }catch(e){
    if(String(e.message)==="PIN"){ throw e }
    try{ var c=JSON.parse(localStorage.getItem("jm_cache")||"{}"); cases=c.cases||[]; staff=(c.staff||[]).map(normStaff); CENTER=c.center||null;
      toast("오프라인 상태입니다. 마지막으로 불러온 내용입니다"); }catch(x){ cases=[];staff=[] }
  }
}
async function loadStaff(){ return }
async function saveOne(c){
  if(!c.id) c.id=uid();
  var i=cases.findIndex(function(x){return x.id===c.id});
  if(i<0)cases.push(c); else cases[i]=c;
  try{ await api({op:"save",kind:"case",data:c}) }catch(e){ toast("저장 실패: 연결을 확인하세요") }
}
async function removeOne(id){
  var i=cases.findIndex(function(x){return x.id===id});
  if(i<0){ toast("삭제할 강의를 찾지 못했습니다"); return }
  cases.splice(i,1);
  try{ await api({op:"delete",kind:"case",id:id}) }catch(e){ toast("삭제 실패: 연결을 확인하세요") }
}
async function saveStaff(p){
  if(!p.id) p.id=uid();
  var i=staff.findIndex(function(x){return x.id===p.id});
  if(i<0)staff.push(p); else staff[i]=p;
  try{ await api({op:"save",kind:"staff",data:p}) }catch(e){ toast("저장 실패: 연결을 확인하세요") }
}
async function removeStaff(id){
  var i=staff.findIndex(function(x){return x.id===id});
  if(i<0){ toast("삭제할 강사를 찾지 못했습니다"); return }
  staff.splice(i,1);
  try{ await api({op:"delete",kind:"staff",id:id}) }catch(e){ toast("삭제 실패: 연결을 확인하세요") }
}
var lastDeleted=null, undoT=null;
function showUndo(label){
  var b=el("undobar");
  b.innerHTML='<span>'+esc(label)+' 삭제됨</span><button type="button" id="btnUndo">되돌리기</button>';
  b.classList.add("on");
  el("btnUndo").onclick=async function(){
    if(!lastDeleted) return;
    if(lastDeleted.kind==="case"){ delete lastDeleted.data._doc; await saveOne(lastDeleted.data); }
    else { delete lastDeleted.data._doc; await saveStaff(lastDeleted.data); }
    lastDeleted=null; hideUndo(); render(); toast("복구되었습니다");
  };
  clearTimeout(undoT); undoT=setTimeout(hideUndo,30000);
}
function hideUndo(){ var b=el("undobar"); b.classList.remove("on"); b.innerHTML=""; }

function exportData(){
  var payload={app:"진로모아 운영보드",version:1,exportedAt:new Date().toISOString(),cases:cases,staff:staff};
  return JSON.stringify(payload,null,2);
}
async function saveFile(name,text,type){
  try{
    var b=new Blob([text],{type:type||"application/json"}), u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},2000); return true;
  }catch(e){ return false }
}
async function importData(text){
  var d;
  try{ d=JSON.parse(text) }catch(e){ toast("백업 파일 형식이 아닙니다"); return }
  if(!d||(!d.cases&&!d.staff)){ toast("강의·강사 정보가 없는 파일입니다"); return }
  var nc=0,ns=0;
  for(var i=0;i<(d.cases||[]).length;i++){
    var c=d.cases[i]; if(!c||!c.org) continue;
    var ex=cases.find(function(x){return x.id===c.id});
    if(ex){ for(var k in c){ if(k!=="_doc") ex[k]=c[k] } await saveOne(ex); }
    else { delete c._doc; if(!c.id)c.id=uid(); await saveOne(c); nc++; }
  }
  for(var j=0;j<(d.staff||[]).length;j++){
    var p2=d.staff[j]; if(!p2||!p2.name) continue;
    var ex2=staff.find(function(x){return x.id===p2.id});
    if(ex2){ for(var k2 in p2){ if(k2!=="_doc") ex2[k2]=p2[k2] } await saveStaff(ex2); }
    else { delete p2._doc; if(!p2.id)p2.id=uid(); await saveStaff(p2); ns++; }
  }
  render(); toast("강의 "+nc+"건, 강사 "+ns+"명 불러왔습니다");
}
function listDocHtml(){
  var rows=cases.slice().sort(function(a,b){return (a.date||"9999").localeCompare(b.date||"9999")});
  var sum=rows.reduce(function(a,c){return a+calc(c).total},0);
  var body='<div class="doc"><div class="dhead"><div class="dkind">LIST</div>'+

function prepTodo(list){

async function prepClick(e){
  var b=e.target.closest("[data-ptog],[data-pdel],[data-padd],[data-pedit],[data-ptpl]"); if(!b) return false;
  var c=cases.find(function(x){return x.id===b.getAttribute("data-pid")}); if(!c) return true;
  var it=prepItems(c).map(function(x){return {n:x.n,d:x.d,o:prepOff(x)}});
  if(b.hasAttribute("data-pedit")){ prepEdit=(b.getAttribute("data-pedit")==="1")?c.id:null; render(); return true }
  if(b.hasAttribute("data-ptog")){ var j=+b.getAttribute("data-ptog"); it[j].d=it[j].d?0:1 }
  else if(b.hasAttribute("data-pdel")){ var k=+b.getAttribute("data-pdel");
    if(!confirm('"'+it[k].n+'" 항목을 지울까요?')) return true; it.splice(k,1) }
  else if(b.hasAttribute("data-ptpl")){ var tp=PREP_TPL[b.getAttribute("data-ptpl")];

    var done={}; it.forEach(function(x){ if(x.d) done[x.n]=1 });
    it=tp.items.map(function(n){return {n:n,d:done[n]?1:0,o:prepOff({n:n})}}) }
  else { var nm=prompt("추가할 준비 항목 이름 (예: 실습지, 교재 인쇄)"); if(!nm||!nm.trim()) return true; nm=nm.trim().slice(0,20);
    var dv=prompt("강의 며칠 전까지 끝내야 하나요? (숫자만, 강의 후에 하는 일이면 0)", PREP_OFF.hasOwnProperty(nm)?String(Math.max(0,-PREP_OFF[nm])):"3");
    var dn=parseInt(dv,10); if(isNaN(dn)) dn=3;
    it.push({n:nm,d:0,o:-Math.max(0,dn)}) }
  if(b.hasAttribute("data-ptpl")) c.prepType=b.getAttribute("data-ptpl");

}

function hasRetro(c){ return !!((c.retroGood||"")+(c.retroHit||"")+(c.retroFix||"")).trim() }
var RETRO_STOP=["특강","강의","교육","과정","및","대상","취업","프로그램"];
function subjWords(t){ return String(t||"").split(/[\s·,\/()\[\]]+/).map(function(w){return w.trim()}).filter(function(w){return w.length>=2&&RETRO_STOP.indexOf(w)<0}) }
function relatedRetros(c){
  var ws=subjWords(c.subject);
  return cases.filter(function(x){ if(x.id===c.id||!hasRetro(x)) return false;
    if(c.org&&x.org===c.org) return true;
    var xw=subjWords(x.subject); return ws.some(function(w){ return xw.some(function(y){ return y.indexOf(w)>=0||w.indexOf(y)>=0 }) });
  }).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")}).slice(0,3);

}
function linesToRows(txt,mk){ return String(txt||"").split(/\n/).map(function(x){return x.trim()}).filter(Boolean).map(mk) }
function normStaff(p){
  p=p||{};
  if(!p.addr&&p.origin) p.addr=p.origin;
  if(!Array.isArray(p.careers)) p.careers=linesToRows(p.career,function(x){return {period:"",org:x,role:""}});
  if(!Array.isArray(p.licenses)) p.licenses=linesToRows(String(p.certs||"").replace(/,/g,"\n"),function(x){return {date:"",name:x,issuer:""}});
  if(!Array.isArray(p.courses)) p.courses=linesToRows(String(p.decks||"").replace(/,/g,"\n"),function(x){return {title:x,hours:"",target:""}});
  if(!Array.isArray(p.edu)) p.edu=[];
  if(!Array.isArray(p.lectures)) p.lectures=[];
  if(!Array.isArray(p.files)) p.files=[];
  if(!p.photo){ var ph=p.files.find(function(f){return f.label==="프로필 사진"}); if(ph) p.photo={id:ph.id,name:ph.name} }
  p.files=p.files.filter(function(f){return f.label!=="프로필 사진"});
  return p;
}
function docsStatus(files){
  var has=function(l){return (files||[]).some(function(f){return f.label===l})};
  if(has("신분증 사본")&&has("통장 사본")) return "제출 완료";
  if(has("신분증 사본")||has("통장 사본")) return "일부 제출";
  return "미제출";
}
function fileUrl(f){ return "/api/file?id="+encodeURIComponent(f.id)+"&p="+encodeURIComponent(PIN) }
function compressImage(file,max){
  return new Promise(function(res){
    if(!(file.type&&file.type.indexOf("image/")===0)){ res(null); return }
    var img=new Image(), u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement("canvas");
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(u);
      res({data:cv.toDataURL("image/jpeg",0.85).split(",")[1],type:"image/jpeg",name:file.name.replace(/\.[^.]+$/,"")+".jpg"});
    };
    img.onerror=function(){ URL.revokeObjectURL(u); res(null) };
    img.src=u;
  });
}
async function uploadFile(file,maxImg){
  var c=await compressImage(file,maxImg||1600);
  if(!c){
    if(file.size>3*1024*1024) throw new Error("3MB 이하 파일만 올릴 수 있습니다");
    var b64=await new Promise(function(res,rej){var rd=new FileReader(); rd.onload=function(){res(String(rd.result).split(",")[1])}; rd.onerror=rej; rd.readAsDataURL(file)});
    c={data:b64,type:file.type||"application/octet-stream",name:file.name};
  }
  var r=await api({op:"fileSave",name:c.name,type:c.type,data:c.data});
  if(!r||!r.id) throw new Error((r&&r.error)||"업로드 실패");
  return {id:r.id,name:c.name};
}

function hanWon(n){
  n=Math.round(n||0);
  var u=["","만","억","조"], d=["","일","이","삼","사","오","육","칠","팔","구"], s4=["","십","백","천"];
  if(!n) return "영";
  var out="", gi=0;
  while(n>0){
    var g=n%10000, gs="", p=0, gg=g;
    while(gg>0){ var v=gg%10; if(v) gs=d[v]+s4[p]+gs; gg=Math.floor(gg/10); p++ }
    if(gs) out=gs+u[gi]+out;
    n=Math.floor(n/10000); gi++;
  }
  return out;
}
function curriculum(c){

  if(!lines.length) return null;
  var start=c.time||"", rows=[], mins=0, total=(+c.hours||0)*60;
  var per= lines.length? Math.round(total/lines.length/5)*5 : 0;
  function fmt(m){ if(!start) return "-"; var hm=start.split(":"); var b=(+hm[0])*60+(+hm[1])+m;
    return ("0"+Math.floor(b/60)%24).slice(-2)+":"+("0"+b%60).slice(-2); }
  lines.forEach(function(L,i){
    var parts=L.split("|");
    var topic=(parts[0]||"").trim(), detail=(parts[1]||"").trim();
    var s1=fmt(mins), e1=fmt(mins+per); mins+=per;
    rows.push('<tr><td style="text-align:center">'+(i+1)+'</td><td style="text-align:center">'+s1+(start?"~"+e1:"")+
      '</td><td>'+esc(topic)+'</td><td>'+esc(detail||"강의 및 실습")+'</td></tr>');
  });
  return '<table class="qtab"><tr><th style="width:8%">차시</th><th style="width:22%">시간</th><th style="width:32%">주제</th><th>주요 내용</th></tr>'+
    rows.join("")+'</table>';
}

function fmtBirth(b){ var p=String(b||"").split("-"); return p.length===3?p[0]+". "+p[1]+". "+p[2]:(b||"") }
function todayKo(){ var d=new Date(); return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일" }
function fieldList(p){ return String(p.field||"").split(/[,·\/]/).map(function(x){return x.trim()}).filter(Boolean) }
function lectureList(p){
  var own=(p.lectures||[]).map(function(l){return {year:l.year||"",org:l.org||"",course:l.course||"",target:l.target||""}});
  var fromBoard=cases.filter(function(c){return c.instructor&&c.instructor===p.name&&STATUS.indexOf(c.status)>=5&&c.org})
    .map(function(c){return {year:(c.date||"").slice(0,4),org:c.org+(c.dept?" "+c.dept:""),course:c.subject||"",target:c.target||""}});
  var seen={}, out=[];
  own.concat(fromBoard).forEach(function(l){ var k=l.year+"|"+l.org+"|"+l.course; if(seen[k]) return; seen[k]=1; out.push(l) });
  out.sort(function(a,b){return String(b.year).localeCompare(String(a.year))});
  return out;
}

var KAKAO_READY=null;
function loadKakao(key){
  if(KAKAO_READY) return KAKAO_READY;
  var vers=["2.7.4","2.7.2","2.6.0"];
  KAKAO_READY=new Promise(function(res,rej){
    function tryLoad(i){
      if(i>=vers.length){ rej(new Error("카카오 SDK를 불러오지 못했습니다")); return }
      var sc=document.createElement("script");
      sc.src="https://t1.kakaocdn.net/kakao_js_sdk/"+vers[i]+"/kakao.min.js";
      sc.onload=function(){ try{ if(!Kakao.isInitialized()) Kakao.init(key); res(Kakao) }catch(e){ rej(e) } };
      sc.onerror=function(){ sc.remove(); tryLoad(i+1) };
      document.head.appendChild(sc);
    }
    tryLoad(0);
  });
  KAKAO_READY.catch(function(){ KAKAO_READY=null });
  return KAKAO_READY;
}

  s.roomType="조별(모둠) 배치";s.screen="빔프로젝터";s.pc="강사 노트북 지참";s.mic="무선 핀마이크";s.net="와이파이";s.roomNote="정문 방문증 발급 필요";

  s.memo="첫인상 4초의 법칙과 표정·자세 교정\n자기소개 1분 스크립트 작성 실습\n모의면접 시연 및 개별 피드백";
  await saveOne(s); var i=cases.findIndex(function(x){return x.id===s.id}); if(i<0)cases.push(s);
  render();
};

window.addEventListener("error",function(e){ try{ toast("오류: "+e.message) }catch(x){} });
function askPin(msg){
  document.getElementById("homeView").style.display="none";
  var w=document.querySelector(".wrap");
  var g=document.createElement("div");
  g.className="sheet"; g.style.marginTop="20px";
  g.innerHTML='<h2 style="margin:0 0 6px;color:var(--navy)">접속 암호</h2>'+
    '<p class="hint">'+(msg||"암호를 입력하세요.")+'</p>'+
    '<input id="pinIn" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="암호">'+
    '<div class="actions" style="position:static;border:none"><button class="btn-main" id="pinGo">들어가기</button></div>';
  w.appendChild(g);
  document.getElementById("pinGo").onclick=function(){
    var v=document.getElementById("pinIn").value.trim();
    if(!v){ toast("암호를 입력하세요"); return }
    localStorage.setItem("jm_pin",v); location.reload();
  };
  document.getElementById("pinIn").addEventListener("keydown",function(ev){ if(ev.key==="Enter") document.getElementById("pinGo").click() });
}
function checkIncoming(){
  var h=location.hash||""; if(h.indexOf("#new?")!==0) return;
  var q=new URLSearchParams(h.slice(5));
  try{ history.replaceState(null,"",location.pathname+location.search) }catch(e){}
  var b=blank(); b.org=(q.get("org")||"").slice(0,60); b.dept=(q.get("dept")||"").slice(0,60); b.mgr=(q.get("mgr")||"").slice(0,40); b.status="제안";
  if(!b.org) return;
  var dup=cases.find(function(c){ return !archived(c)&&c.org===b.org&&(c.status==="문의"||c.status==="제안") });
  anchorEl=null;
  if(dup&&!confirm(b.org+"은(는) 이미 '"+dup.status+"' 단계로 등록돼 있어요.\n새 강의로 따로 등록할까요?\n(취소하면 기존 강의를 열어요)")){ openForm(JSON.parse(JSON.stringify(dup))); return }
  openForm(b); toast("제안서 정보로 채웠어요. 일정·주제를 넣고 저장하세요");
}
(async function(){
  await initStore();
  try{ await loadAll(); }
  catch(e){
    if(String(e.message)==="PIN"){ localStorage.removeItem("jm_pin"); askPin(PIN?"암호가 맞지 않습니다. 다시 입력해 주세요.":"암호를 입력하세요."); return }
  }
  render();
  checkIncoming();
  document.addEventListener("visibilitychange",async function(){
    if(document.visibilityState!=="visible") return;
    var editing=(el("dlg").style.display==="block"||el("docArea").style.display==="block");
    if(editing) return;
    try{ await loadAll(); render(); }catch(e){}
  });
})();
</script>
</body>
</html>
